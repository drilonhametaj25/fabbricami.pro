name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_erp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_erp_test
      
      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_erp_test
      
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_erp_test
          REDIS_HOST: localhost
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
      
      - name: Build
        run: npm run build
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            echo "=========================================="
            echo "DEPLOY STARTED at $(date)"
            echo "=========================================="

            cd /opt/ecommerceerp

            echo ">>> Pulling latest code..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo ">>> Current commit:"
            git log -1 --oneline

            echo ">>> Cleaning up old fixed-name containers (one-time migration)..."
            docker rm -f ecommerceerp-demo ecommerceerp-frontend ecommerceerp-marketing ecommerceerp-backend 2>/dev/null || true

            echo ">>> Building and deploying (zero-downtime)..."
            # Build new images while old containers keep running
            docker compose -f docker-compose.prod.yml build --pull --parallel

            # Start/recreate containers - Traefik routes to healthy ones
            # Old containers stay up until new ones are healthy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo ">>> Waiting for containers to be healthy..."
            sleep 15

            echo ">>> Running smart database migration..."
            docker compose -f docker-compose.prod.yml exec -T backend sh /app/scripts/smart-migrate.sh

            echo ">>> Cleaning up old images..."
            docker image prune -f || true

            echo ">>> Checking container status..."
            docker compose -f docker-compose.prod.yml ps

            echo "=========================================="
            echo "DEPLOY COMPLETED at $(date)"
            echo "=========================================="
