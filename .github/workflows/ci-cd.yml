name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabbricami_pro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm bug #4828: optional deps platform-specific (es. @rollup/rollup-linux-x64-gnu)
      # non sempre vengono risolte da `npm install` se il lock file e' stato generato
      # su un'altra piattaforma. Pulizia esplicita garantisce reinstall pulito sul
      # runner Linux. Le optionalDependencies in package.json forzano l'inclusione
      # dei binari rollup di tutte le piattaforme supportate.
      - name: Clean install
        run: |
          rm -rf node_modules
          npm install --no-audit --no-fund
      
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabbricami_pro_test
      
      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabbricami_pro_test
      
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabbricami_pro_test
          REDIS_HOST: localhost
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
      
      - name: Build
        run: npm run build
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          command_timeout: 30m
          # HARDENING: script_stop: true means any failing command (without an
          # explicit `|| true` fallback) aborts the deploy. Previously this was
          # false, which caused failed migrations and broken health checks to
          # silently let a broken release go live.
          script_stop: true
          script: |
            set -e
            echo "=========================================="
            echo "DEPLOY STARTED at $(date)"
            echo "=========================================="

            cd /opt/ecommerceerp

            echo ">>> Pulling latest code..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo ">>> Current commit:"
            git log -1 --oneline

            echo ">>> Cleaning up old fixed-name containers (one-time migration)..."
            docker rm -f ecommerceerp-demo ecommerceerp-frontend ecommerceerp-marketing ecommerceerp-backend 2>/dev/null || true

            echo ">>> Building and deploying (zero-downtime)..."
            # Build new images while old containers keep running
            docker compose -f docker-compose.prod.yml build --pull --parallel

            # Start/recreate containers - Traefik routes to healthy ones
            # Old containers stay up until new ones are healthy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo ">>> Waiting for containers to be healthy..."
            sleep 20

            echo ">>> Running smart database migration (with timeout protection)..."
            # HARDENING: a failed migration MUST fail the deploy.
            # Previously this used `|| { ... }` without exit, which let a
            # broken schema go live. Now any migration failure aborts.
            #
            # Capture the real exit code: `if ! cmd; then EXIT_CODE=$?` always
            # gives 0 because `!` inverts the inner exit and $? then reflects
            # the negation result (success), not the original failure code.
            # Use the explicit `|| EXIT_CODE=$?` pattern instead.
            EXIT_CODE=0
            timeout 300 docker compose -f docker-compose.prod.yml exec -T backend sh /app/scripts/smart-migrate.sh || EXIT_CODE=$?
            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "!!! MIGRATION FAILED (exit code $EXIT_CODE)"
              if [ "$EXIT_CODE" -eq 124 ]; then
                echo "!!! Reason: migration timed out after 5 minutes"
              elif [ "$EXIT_CODE" -eq 137 ]; then
                echo "!!! Reason: migration was killed (OOM or signal)"
              elif [ "$EXIT_CODE" -eq 2 ]; then
                echo "!!! Reason: shell syntax error in /app/scripts/smart-migrate.sh"
              fi
              echo ">>> Backend container status:"
              docker compose -f docker-compose.prod.yml ps backend || true
              echo ">>> Recent backend logs:"
              docker compose -f docker-compose.prod.yml logs backend --tail 50 || true
              echo ">>> Aborting deploy. Investigate and re-run after fixing the migration."
              exit 1
            fi

            echo ">>> Cleaning up old images..."
            docker image prune -f || true

            echo ">>> Final container status..."
            docker compose -f docker-compose.prod.yml ps

            echo ">>> Health check - testing backend API..."
            # HARDENING: retry health check up to 6 times (1 minute) before
            # giving up. Fail the deploy if the backend never responds 2xx.
            HEALTH_OK=0
            for attempt in 1 2 3 4 5 6; do
              sleep 10
              if curl -sf http://localhost:3000/api/health; then
                echo "Backend healthy on attempt $attempt!"
                HEALTH_OK=1
                break
              fi
              echo "Health check attempt $attempt failed, retrying in 10s..."
            done
            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "!!! Backend is not healthy after 60s — aborting deploy"
              docker compose -f docker-compose.prod.yml logs backend --tail 50 || true
              exit 1
            fi

            echo "=========================================="
            echo "DEPLOY COMPLETED at $(date)"
            echo "=========================================="
